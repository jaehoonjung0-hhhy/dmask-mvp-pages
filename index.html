<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="D마스크 생산 LOT 경보와 현장 대응 시연">
  <title>D마스크 품질 관제</title>
  <link rel="stylesheet" href="style.css">
  <script src="workflow.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="mark" aria-hidden="true">D</span><span>D마스크</span><small>품질 관제</small></div>
      <label class="role">시연 역할 <select id="role">
        <option value="worker">현장 작업자</option>
        <option value="supervisor">해제 승인자</option>
        <option value="quality">품질 담당자</option>
      </select></label>
    </div>
  </header>
  <main>
    <section class="page-heading">
      <div class="title-line">
        <h1>LOT 경보 관제</h1>
        <span class="demo">시연용</span>
      </div>
      <p>생산 LOT의 경보를 확인하고 현장 조치와 검사 결과를 기록하세요.</p>
    </section>
    <section id="stats" class="stats" aria-label="상태별 경보 건수"></section>
    <div class="board">
      <section class="queue panel" aria-labelledby="queue-title">
        <div class="queue-head"><h2 id="queue-title">경보 목록</h2>
          <label class="filter"><span class="visually-hidden">경보 상태 필터</span><select id="filter">
            <option value="all">전체 상태</option><option value="open">신규</option>
            <option value="held">점검 보류</option><option value="review">해제 승인 대기</option><option value="closed">해제</option>
          </select></label>
        </div>
        <div id="queue"></div>
      </section>
      <section class="panel detail" aria-label="경보 상세">
        <div id="notice" role="status" class="notice"></div>
        <div id="detail"></div>
      </section>
    </div>
    <footer>시연 기록은 이 브라우저에 저장됩니다.<button id="reset" class="text-button" type="button">시연 기록 초기화</button></footer>
  </main>
</body>
</html>
